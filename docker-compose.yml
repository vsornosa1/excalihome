services:
  db:
    image: postgres:15-alpine
    container_name: excalihome-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-excalihome}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-excalihome}
      POSTGRES_DB: ${DB_NAME:-excalihome}
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-excalihome} -d ${DB_NAME:-excalihome}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    container_name: excalihome-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgres://${DB_USER:-excalihome}:${DB_PASSWORD:-excalihome}@db:5432/${DB_NAME:-excalihome}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: excalihome-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  db_data:
